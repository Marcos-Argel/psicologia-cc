<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gold Gradients for Brain & Accents -->
    <linearGradient id="goldGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAD7B7" />
      <stop offset="45%" stop-color="#C5A880" />
      <stop offset="85%" stop-color="#9C7948" />
      <stop offset="100%" stop-color="#826233" />
    </linearGradient>

    <!-- Leaves Gradients -->
    <linearGradient id="leafGradTopIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#97AC99" />
      <stop offset="100%" stop-color="#728875" />
    </linearGradient>

    <linearGradient id="leafGradMidIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7E9482" />
      <stop offset="100%" stop-color="#556E5A" />
    </linearGradient>

    <linearGradient id="leafGradBotIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69806D" />
      <stop offset="100%" stop-color="#455B49" />
    </linearGradient>

    <!-- Soft Depth Filter -->
    <filter id="iconDepth" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.2" dy="2" stdDeviation="2.2" flood-color="#1B2B24" flood-opacity="0.18" />
    </filter>
  </defs>

  <g transform="translate(6, 6)" filter="url(#iconDepth)">
    <!-- Enclosing Outer Arc -->
    <path d="M 98 18 A 82 82 0 0 1 178 95" stroke="url(#goldGradIcon)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 172 118 A 82 82 0 0 1 98 178" stroke="url(#goldGradIcon)" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- 3 Connection Dots -->
    <circle cx="184" cy="74" r="3.4" fill="url(#goldGradIcon)" />
    <circle cx="188" cy="98" r="3.7" fill="url(#goldGradIcon)" />
    <circle cx="183" cy="122" r="3.4" fill="url(#goldGradIcon)" />

    <!-- LEFT HEMISPHERE: Brain Gyri (Gold) -->
    <path d="M 94 28 C 74 27, 54 36, 45 48 C 34 58, 28 72, 30 86 C 24 94, 23 106, 27 117 C 24 128, 29 140, 39 149 C 48 159, 64 167, 82 168 C 88 168, 94 167, 94 167" 
          stroke="url(#goldGradIcon)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Internal Brain Folds -->
    <path d="M 94 44 C 76 43, 62 52, 57 65 C 53 74, 58 84, 70 86 C 82 87, 94 77, 94 77" 
          stroke="url(#goldGradIcon)" stroke-width="4.2" stroke-linecap="round" fill="none" />
    
    <path d="M 40 85 C 48 83, 56 89, 61 97 C 67 106, 61 118, 50 119 C 41 120, 35 113, 35 106" 
          stroke="url(#goldGradIcon)" stroke-width="3.8" stroke-linecap="round" fill="none" />

    <path d="M 94 88 C 84 89, 74 97, 75 108 C 76 119, 86 125, 94 125" 
          stroke="url(#goldGradIcon)" stroke-width="4.2" stroke-linecap="round" fill="none" />

    <path d="M 48 132 C 55 125, 68 126, 75 136 C 81 145, 75 156, 64 158 C 55 160, 47 151, 48 141" 
          stroke="url(#goldGradIcon)" stroke-width="3.8" stroke-linecap="round" fill="none" />

    <path d="M 94 139 C 85 140, 80 148, 83 156 C 86 163, 91 166, 94 166" 
          stroke="url(#goldGradIcon)" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Center Stem -->
    <path d="M 95 26 L 95 170" stroke="url(#goldGradIcon)" stroke-width="3.2" stroke-linecap="round" />

    <!-- RIGHT HEMISPHERE: Organic Foliage / Leaves -->
    <path d="M 96 168 C 104 140, 112 100, 102 30" stroke="#3D5643" stroke-width="3.5" stroke-linecap="round" />

    <path d="M 98 32 C 112 36, 128 48, 126 62 C 124 74, 108 72, 101 64 Z" 
          fill="url(#leafGradTopIcon)" stroke="#354E3C" stroke-width="1.2" />

    <path d="M 103 62 C 124 61, 148 72, 146 90 C 144 104, 122 100, 107 88 Z" 
          fill="url(#leafGradMidIcon)" stroke="#2B4232" stroke-width="1.2" />

    <path d="M 106 87 C 132 89, 154 104, 151 122 C 148 136, 126 130, 108 114 Z" 
          fill="url(#leafGradBotIcon)" stroke="#213527" stroke-width="1.2" />

    <path d="M 106 114 C 128 122, 144 138, 138 152 C 132 163, 114 156, 103 140 Z" 
          fill="url(#leafGradMidIcon)" stroke="#2B4232" stroke-width="1.2" />

    <path d="M 100 140 C 114 148, 124 159, 118 167 C 112 173, 101 169, 98 165 Z" 
          fill="url(#leafGradTopIcon)" stroke="#354E3C" stroke-width="1.2" />

    <!-- Vein Highlights -->
    <path d="M 108 74 C 118 78, 130 83, 138 88" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
    <path d="M 112 99 C 124 105, 136 112, 142 118" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
    <path d="M 109 124 C 118 130, 127 137, 132 143" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
  </g>
</svg>
