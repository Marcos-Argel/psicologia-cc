  <!-- LOGOTIPO TYPOGRAPHY -->
  <g transform="translate(138, 20)">
    <text x="0" y="32" class="brand-title-line1-light">Psicología y</text>
    <text x="0" y="65" class="brand-title-line2-light">Psicooncología <tspan fill="#E5CCA3">C.C.</tspan></text>

    <line x1="0" y1="84" x2="35" y2="84" stroke="#DDC49E" stroke-width="1.2" stroke-linecap="round" />
    <text x="44" y="87" class="brand-slogan-light">ACOMPAÑAMOS TU PROCESO, TRANSFORMAMOS JUNTOS</text>
    <line x1="345" y1="84" x2="375" y2="84" stroke="#DDC49E" stroke-width="1.2" stroke-linecap="round" />
