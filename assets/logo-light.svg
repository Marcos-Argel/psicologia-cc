<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&amp;family=Montserrat:wght@500;600;700&amp;display=swap');
      .brand-title-line1-light {
        font-family: 'Cormorant Garamond', 'Times New Roman', serif;
        font-size: 30px;
        font-weight: 600;
        fill: #F5F2EB;
        letter-spacing: 0.5px;
      }
      .brand-title-line2-light {
        font-family: 'Cormorant Garamond', 'Times New Roman', serif;
        font-size: 32px;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: 0.5px;
      }
      .brand-slogan-light {
        font-family: 'Montserrat', sans-serif;
        font-size: 8.5px;
        font-weight: 600;
        fill: #D8CFBE;
        letter-spacing: 2.2px;
      }
    </style>

    <linearGradient id="goldGradLightFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFBE" />
      <stop offset="50%" stop-color="#DDC49E" />
      <stop offset="100%" stop-color="#B89762" />
    </linearGradient>
    <linearGradient id="leafGradDarkLightFull" x1="0%" y1="0%" x2="100%" y2="100%">
