<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&amp;family=Montserrat:wght@500;600;700&amp;display=swap');
      
      .brand-text-gold-light {
        font-family: 'Cormorant Garamond', 'Times New Roman', Georgia, serif;
        font-size: 33px;
        font-weight: 600;
        fill: url(#goldGradLightText);
        letter-spacing: 0.5px;
      }
      
      .brand-slogan-light {
        font-family: 'Montserrat', -apple-system, sans-serif;
        font-size: 8.5px;
        font-weight: 600;
        fill: #D8E2DC;
        letter-spacing: 2.2px;
      }
    </style>

    <!-- Metallic Light Gold Gradient for Dark Backgrounds -->
    <linearGradient id="goldGradLightText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0D4" />
      <stop offset="40%" stop-color="#E2CCA6" />
      <stop offset="80%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#B89767" />
    </linearGradient>

    <linearGradient id="goldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0D4" />
      <stop offset="50%" stop-color="#D8BC94" />
      <stop offset="100%" stop-color="#B89767" />
    </linearGradient>

    <!-- Leaves Gradients for Dark BG -->
    <linearGradient id="leafGradTopLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B2C7B4" />
      <stop offset="100%" stop-color="#8EA591" />
    </linearGradient>

    <linearGradient id="leafGradMidLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93AB97" />
      <stop offset="100%" stop-color="#6F8873" />
    </linearGradient>

    <linearGradient id="leafGradBotLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B947E" />
      <stop offset="100%" stop-color="#556E5A" />
    </linearGradient>
  </defs>

  <!-- ISOTIPO -->
  <g transform="translate(14, 12) scale(0.58)">
    <!-- Enclosing Outer Arc -->
    <path d="M 98 18 A 82 82 0 0 1 178 95" stroke="url(#goldGradLight)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 172 118 A 82 82 0 0 1 98 178" stroke="url(#goldGradLight)" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- 3 Connection Dots -->
    <circle cx="184" cy="74" r="3.2" fill="url(#goldGradLight)" />
    <circle cx="188" cy="98" r="3.5" fill="url(#goldGradLight)" />
    <circle cx="183" cy="122" r="3.2" fill="url(#goldGradLight)" />

    <!-- LEFT HEMISPHERE: Brain Gyri -->
    <path d="M 94 28 C 74 27, 54 36, 45 48 C 34 58, 28 72, 30 86 C 24 94, 23 106, 27 117 C 24 128, 29 140, 39 149 C 48 159, 64 167, 82 168 C 88 168, 94 167, 94 167" 
          stroke="url(#goldGradLight)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <path d="M 94 44 C 76 43, 62 52, 57 65 C 53 74, 58 84, 70 86 C 82 87, 94 77, 94 77" 
          stroke="url(#goldGradLight)" stroke-width="4.2" stroke-linecap="round" fill="none" />
    
    <path d="M 40 85 C 48 83, 56 89, 61 97 C 67 106, 61 118, 50 119 C 41 120, 35 113, 35 106" 
          stroke="url(#goldGradLight)" stroke-width="3.8" stroke-linecap="round" fill="none" />

    <path d="M 94 88 C 84 89, 74 97, 75 108 C 76 119, 86 125, 94 125" 
          stroke="url(#goldGradLight)" stroke-width="4.2" stroke-linecap="round" fill="none" />

    <path d="M 48 132 C 55 125, 68 126, 75 136 C 81 145, 75 156, 64 158 C 55 160, 47 151, 48 141" 
          stroke="url(#goldGradLight)" stroke-width="3.8" stroke-linecap="round" fill="none" />

    <path d="M 94 139 C 85 140, 80 148, 83 156 C 86 163, 91 166, 94 166" 
          stroke="url(#goldGradLight)" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Center Stem -->
    <path d="M 95 26 L 95 170" stroke="url(#goldGradLight)" stroke-width="3.2" stroke-linecap="round" />

    <!-- RIGHT HEMISPHERE: Organic Foliage -->
    <path d="M 96 168 C 104 140, 112 100, 102 30" stroke="#8EA591" stroke-width="3.5" stroke-linecap="round" />

    <path d="M 98 32 C 112 36, 128 48, 126 62 C 124 74, 108 72, 101 64 Z" 
          fill="url(#leafGradTopLight)" stroke="#C8DBC9" stroke-width="0.8" />

    <path d="M 103 62 C 124 61, 148 72, 146 90 C 144 104, 122 100, 107 88 Z" 
          fill="url(#leafGradMidLight)" stroke="#ADC5AF" stroke-width="0.8" />

    <path d="M 106 87 C 132 89, 154 104, 151 122 C 148 136, 126 130, 108 114 Z" 
          fill="url(#leafGradBotLight)" stroke="#92AB94" stroke-width="0.8" />

    <path d="M 106 114 C 128 122, 144 138, 138 152 C 132 163, 114 156, 103 140 Z" 
          fill="url(#leafGradMidLight)" stroke="#ADC5AF" stroke-width="0.8" />

    <path d="M 100 140 C 114 148, 124 159, 118 167 C 112 173, 101 169, 98 165 Z" 
          fill="url(#leafGradTopLight)" stroke="#C8DBC9" stroke-width="0.8" />
  </g>

  <!-- VERTICAL DIVIDER LINE -->
  <line x1="140" y1="28" x2="140" y2="114" stroke="url(#goldGradLight)" stroke-width="1.6" stroke-linecap="round" opacity="0.9" />

  <!-- TYPOGRAPHY & SLOGAN -->
  <g transform="translate(156, 20)">
    <text x="0" y="32" class="brand-text-gold-light">Psicología y</text>
    <text x="0" y="66" class="brand-text-gold-light">Psicooncología C.C.</text>

    <!-- Slogan -->
    <g transform="translate(0, 83)">
      <line x1="0" y1="5" x2="26" y2="5" stroke="url(#goldGradLight)" stroke-width="1.4" stroke-linecap="round" />
      <text x="32" y="8" class="brand-slogan-light">ACOMPAÑAMOS TU PROCESO,</text>
      <line x1="228" y1="5" x2="254" y2="5" stroke="url(#goldGradLight)" stroke-width="1.4" stroke-linecap="round" />
      
      <text x="40" y="21" class="brand-slogan-light">TRANSFORMAMOS JUNTOS</text>
    </g>
  </g>
</svg>
