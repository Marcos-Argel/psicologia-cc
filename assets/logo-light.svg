      <stop offset="100%" stop-color="#3B5A4E" />
    </linearGradient>
    <linearGradient id="leafGradMidLightFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DA290" />
      <stop offset="100%" stop-color="#527766" />
