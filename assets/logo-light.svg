    <path d="M 94 28 C 74 27, 54 36, 45 48 C 34 58, 28 72, 30 86 C 24 94, 23 106, 27 117 C 24 128, 29 140, 39 149 C 48 159, 64 167, 82 168 C 88 168, 94 167, 94 167" 
