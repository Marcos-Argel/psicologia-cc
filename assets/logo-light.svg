    <linearGradient id="leafGradLightLightFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AFD1C0" />
      <stop offset="100%" stop-color="#84A795" />
    </linearGradient>
  </defs>

