<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="heroBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="100%" stop-color="#F2ECE1" />
    </linearGradient>
    <linearGradient id="heroGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAD7B7" />
      <stop offset="45%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#8F6C3C" />
    </linearGradient>
    <linearGradient id="heroSageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#728875" />
      <stop offset="100%" stop-color="#455B49" />
    </linearGradient>

    <!-- Filters -->
    <filter id="heroCardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1A2E26" flood-opacity="0.10" />
    </filter>
    <filter id="pillShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1A2E26" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Ambient Organic Circles -->
  <circle cx="480" cy="160" r="160" fill="#E8EFEA" opacity="0.6" />
  <circle cx="120" cy="380" r="130" fill="#F3ECE0" opacity="0.7" />

  <!-- Main Card -->
  <rect x="60" y="40" width="480" height="430" rx="32" fill="#FFFFFF" filter="url(#heroCardShadow)" />
  <rect x="60" y="40" width="480" height="430" rx="32" stroke="#EFE8DD" stroke-width="1.5" />

  <!-- Top Golden Accent Arch -->
  <path d="M 60 76 Q 300 44 540 76" stroke="url(#heroGoldGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Central Emblem with Concentric Circles -->
  <g transform="translate(300, 205)">
    <!-- Decorative dashed ring -->
    <circle cx="0" cy="0" r="94" stroke="url(#heroGoldGrad)" stroke-width="1.8" stroke-dasharray="6 5" opacity="0.5" />
    <circle cx="0" cy="0" r="80" fill="#FAF8F5" stroke="#EAE3D6" stroke-width="1.2" />

    <!-- Emblem Group -->
    <g transform="translate(-64, -64) scale(0.68)">
      <!-- Golden Crescent Arc -->
      <path d="M 98 18 A 82 82 0 0 1 178 95" stroke="url(#heroGoldGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <path d="M 172 118 A 82 82 0 0 1 98 178" stroke="url(#heroGoldGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" />

      <!-- 3 Connection Dots -->
      <circle cx="184" cy="74" r="3.4" fill="url(#heroGoldGrad)" />
      <circle cx="188" cy="98" r="3.7" fill="url(#heroGoldGrad)" />
      <circle cx="183" cy="122" r="3.4" fill="url(#heroGoldGrad)" />

      <!-- Brain Hemisphere (Gold) -->
      <path d="M 94 28 C 74 27, 54 36, 45 48 C 34 58, 28 72, 30 86 C 24 94, 23 106, 27 117 C 24 128, 29 140, 39 149 C 48 159, 64 167, 82 168 L 94 167" 
            stroke="url(#heroGoldGrad)" stroke-width="5" stroke-linecap="round" fill="none" />
      <path d="M 94 44 C 76 43, 62 52, 57 65 C 53 74, 58 84, 70 86 C 82 87, 94 77, 94 77" 
            stroke="url(#heroGoldGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M 40 85 C 48 83, 56 89, 61 97 C 67 106, 61 118, 50 119 C 41 120, 35 113, 35 106" 
            stroke="url(#heroGoldGrad)" stroke-width="3.8" stroke-linecap="round" fill="none" />
      <path d="M 94 88 C 84 89, 74 97, 75 108 C 76 119, 86 125, 94 125" 
            stroke="url(#heroGoldGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M 48 132 C 55 125, 68 126, 75 136 C 81 145, 75 156, 64 158" 
            stroke="url(#heroGoldGrad)" stroke-width="3.8" stroke-linecap="round" fill="none" />

      <!-- Center Divider -->
      <path d="M 95 26 L 95 170" stroke="url(#heroGoldGrad)" stroke-width="3.2" stroke-linecap="round" />

      <!-- Foliage Hemisphere (Sage) -->
      <path d="M 96 168 C 104 140, 112 100, 102 30" stroke="#3D5643" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 98 32 C 112 36, 128 48, 126 62 C 124 74, 108 72, 101 64 Z" fill="#849C87" />
      <path d="M 103 62 C 124 61, 148 72, 146 90 C 144 104, 122 100, 107 88 Z" fill="#67806C" />
      <path d="M 106 87 C 132 89, 154 104, 151 122 C 148 136, 126 130, 108 114 Z" fill="#4B6350" />
      <path d="M 106 114 C 128 122, 144 138, 138 152 C 132 163, 114 156, 103 140 Z" fill="#67806C" />
      <path d="M 100 140 C 114 148, 124 159, 118 167 C 112 173, 101 169, 98 165 Z" fill="#849C87" />
    </g>
  </g>

  <!-- Floating Pill 1: Psicooncología (Top Left) -->
  <g transform="translate(30, 130)" filter="url(#pillShadow)">
    <rect width="195" height="52" rx="26" fill="#FFFFFF" stroke="#EAE4D8" stroke-width="1.2" />
    <circle cx="28" cy="26" r="14" fill="#F4EFE6" />
    <path d="M 24 26 C 24 23 27 21 30 23 C 33 21 36 23 36 26 C 36 30 30 33 30 33 C 30 33 24 30 24 26 Z" fill="#C5A880" />
    <text x="52" y="23" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="700" fill="#1A2E26">Psicooncología</text>
    <text x="52" y="36" font-family="'Montserrat', sans-serif" font-size="9" fill="#6E7D75">Acompañamiento integral</text>
  </g>

  <!-- Floating Pill 2: Espacio Seguro (Middle Right) -->
  <g transform="translate(370, 255)" filter="url(#pillShadow)">
    <rect width="195" height="52" rx="26" fill="#FFFFFF" stroke="#EAE4D8" stroke-width="1.2" />
    <circle cx="28" cy="26" r="14" fill="#EEF4F0" />
    <path d="M 22 26 L 26 30 L 34 21" stroke="#254034" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="52" y="23" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="700" fill="#1A2E26">Espacio Seguro</text>
    <text x="52" y="36" font-family="'Montserrat', sans-serif" font-size="9" fill="#6E7D75">100% Confidencial</text>
  </g>

  <!-- Floating Pill 3: Atención Virtual y Presencial (Left Lower - No overlap with text) -->
  <g transform="translate(30, 310)" filter="url(#pillShadow)">
    <rect width="185" height="48" rx="24" fill="#254034" />
    <circle cx="26" cy="24" r="12" fill="#3D5E50" />
    <circle cx="26" cy="24" r="4.5" fill="#C5A880" />
    <text x="48" y="22" font-family="'Montserrat', sans-serif" font-size="9.5" font-weight="600" fill="#FAF8F5">Atención Virtual</text>
    <text x="48" y="34" font-family="'Montserrat', sans-serif" font-size="8.5" fill="#CBD5CA">&amp; Presencial</text>
  </g>

  <!-- Bottom Quote inside Card (Plenty of vertical room, no overlaps) -->
  <g transform="translate(300, 420)">
    <line x1="-190" y1="-8" x2="-140" y2="-8" stroke="url(#heroGoldGrad)" stroke-width="1.2" stroke-linecap="round" />
    <text x="0" y="-4" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="18.5" font-weight="600" font-style="italic" fill="#254034" letter-spacing="0.4">
      "Acompañamos tu proceso, transformamos juntos."
    </text>
    <line x1="140" y1="-8" x2="190" y2="-8" stroke="url(#heroGoldGrad)" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>
